name: kuberadmsdn
description: "LHC DMS Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.3+7   # for camera access

  # 🔐 storage
  shared_preferences: ^2.2.2

  # 🌐 networking
  http: ^1.1.0

  # 📅 formatting
  intl: ^0.20.2

  # 📷 media
  image_picker: ^1.0.4

  # 📍 location
  geolocator: ^12.0.0 # ✅ Updated to match your Dart 3.3.0 SDK compatibility profile safely
  permission_handler: ^12.0.1

  # 📱 device info
  device_info_plus: ^12.3.0

  # 🍏 UI
  cupertino_icons: ^1.0.8

  dio: ^5.4.0  # Or the latest version

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 🚀 app icon generator
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png" # ✅ Fixed text trailing typo bugs here